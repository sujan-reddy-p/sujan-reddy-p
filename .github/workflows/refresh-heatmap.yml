name: refresh contribution graphs

# Daily at 06:00 UTC. Refreshes the contribution heatmap + stats SVG
# by re-running the python pipeline. ASCII portrait and info strip
# are hand-curated and re-rendered only on manual dispatch.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install "rembg[cpu]" onnxruntime

      - name: refresh contribution fetch
        env:
          GH_PROFILE_USER: sujan-reddy-p
        run: |
          GH_PROFILE_USER="${GH_PROFILE_USER}" \
            python scripts/fetch_contributions.py

      - name: re-render heatmap
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py

      - name: commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/contributions.json contrib-heatmap.svg stats.svg
            git commit -m "chore: refresh contribution graphs $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no contribution graph changes"
          fi
